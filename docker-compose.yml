services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cenematic-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Cenematic@2024"
      MSSQL_PID: "Developer"
    ports:
      # Override DB_PORT if you already run a local SQL Server on 1433.
      - "${DB_PORT:-1433}:1433"
    volumes:
      - cenematic-data:/var/opt/mssql
      # Mounted for convenience; the mssql image has no auto-init hook, so the
      # schema is imported explicitly (see README "Create the database").
      - ./db:/db:ro
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

volumes:
  cenematic-data:
